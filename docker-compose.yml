# The same setup as example 10 – only the "web" service is now a FastAPI app.
# Start everything with:  docker compose up --build

services:
  # ---------------------------------------------------------------------------
  # FastAPI application – built from ./app/Dockerfile, served by Uvicorn
  # ---------------------------------------------------------------------------
  web:
    build: ./app
    image: python-fastapi-web
    ports:
      - "3033:3033"              # API: http://localhost:3033, docs: http://localhost:3033/docs
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis – stores the data, reachable only inside this project
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis Insight – web console to look at the stored data
  # ---------------------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"              # open http://localhost:5540
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "fastapi-redis"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana – dashboards with charts, reads the readings from the REST API
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"              # open http://localhost:3000 (admin / admin)
    environment:
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis-data:
  redis-insight-data:
  grafana-data: